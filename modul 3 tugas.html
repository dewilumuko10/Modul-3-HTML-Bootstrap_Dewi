<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Registrasi - Modul 2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>
  <div class="container" style="margin-top:40px;">
    <h2>Form Registrasi</h2>
    <form action="">
      <div class="form-group">
        <label for="nama">Nama :</label>
        <input type="text" class="form-control" id="nama" placeholder="Name" name="nama" required>
      </div>
      <div class="form-group">
        <label for="email">Email :</label>
        <input type="email" class="form-control" id="email" placeholder="Email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password :</label>
        <input type="password" class="form-control" id="password" placeholder="Password" name="Password" required>
      </div>
      <div class="form-group">
        <label for="jk">Jenis Kelamin:</label>
        <select class="form-control" id="jk">
          <option>Pria</option>
          <option>Wanita</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>

  <footer class="container text-center" style="margin-top:60px; padding:15px 0; border-top:1px solid #ddd;">
    <p>Dewi Christania Lumuko &mdash; NIM: 240211060066</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>
</html>
